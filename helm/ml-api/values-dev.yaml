# Dev overrides only what differs from values.yaml, the platform defaults.
#
# On local Minikube, the image is loaded straight into the node's runtime
# with `minikube image load`, not pulled from any registry. So pullPolicy
# must be Never. Otherwise Kubernetes tries to pull it from Docker Hub, and
# that pull fails.

image:
  pullPolicy: Never

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
