suite: Secret conditional rendering and wiring
release:
  name: ml-api
templates:
  - secret.yaml
  - deployment.yaml

tests:
  - it: does not render a Secret by default
    asserts:
      - hasDocuments:
          count: 0
        template: secret.yaml

  - it: does not add envFrom to the container by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
        template: deployment.yaml

  - it: renders a Secret with the given data when secrets.create is true
    set:
      secrets.create: true
      secrets.data.API_KEY: dummy-value
    asserts:
      - hasDocuments:
          count: 1
        template: secret.yaml
      - equal:
          path: stringData.API_KEY
          value: dummy-value
        template: secret.yaml

  - it: wires envFrom to the chart-managed secret when created
    set:
      secrets.create: true
      secrets.data.API_KEY: dummy-value
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: ml-api
        template: deployment.yaml

  - it: prefers existingSecret over the chart-managed one
    set:
      secrets.create: true
      secrets.data.API_KEY: dummy-value
      secrets.existingSecret: some-other-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: some-other-secret
        template: deployment.yaml
